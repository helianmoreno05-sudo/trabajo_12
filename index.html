<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Proyecto 12: Zona de texto con límite</title>
  <link rel="stylesheet" href="estilos.css">
</head>
<body>
  <!-- Caja blanca que guarda todo -->
  <div class="tarjeta">
    <!-- Titulo de la zona de texto -->
    <label for="mensaje">tu mensaje</label>
    <!-- donde el usuario escribe -->
    <textarea id="mensaje" placeholder="escribir aqui" aria-describedby="contador"></textarea>
    <!-- Contador de caracteres -->
    <p id="contador">0 / 250</p>
  </div>

  
  <script src="script.js"></script>
</body>
</html>
